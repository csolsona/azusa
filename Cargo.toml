[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
azusa-core = { path = "crates/azusa-core" }
eframe = { version = "0.37", features = ["persistence"] }
egui_extras = "0.37"
thiserror = "2"
tiny_http = "0.12.0"
ureq = { version = "3", features = ["json"] }
log = "0.4"
env_logger = "0.11"
cynic = "3"
cynic-codegen = "3"
jiff = "0.2"
keyring = "4"
anitomy-ng = "1"
walkdir = "2"
tempfile = "3"
unicode-normalization = "0.1.26"
open = "5"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
directories = "6"

[profile.release]
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
self_named_module_files = "warn"
