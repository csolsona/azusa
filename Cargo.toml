[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
azusa-core = { path = "crates/azusa-core" }
eframe = "0.37"
egui_extras = "0.37"
thiserror = "2"
tiny_http = "0.12.0"
ureq = { version = "3", features = ["json"] }
log = "0.4"
env_logger = "0.11"
cynic = "3"
cynic-codegen = "3"
jiff = "0.2"
keyring = "4"
anitomy-ng = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
self_named_module_files = "warn"
